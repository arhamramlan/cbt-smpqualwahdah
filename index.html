<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT Web Application - Supabase & GitHub Pages</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col select-none">

    <!-- Header Navbar -->
    <header class="bg-indigo-700 text-white shadow-md py-3 px-6 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-[#10b981] fa-graduation-cap text-2xl"></i>
            <h1 class="text-xl font-bold tracking-wide">CBT Online Portal</h1>
        </div>
        <div id="userInfo" class="hidden items-center space-x-4">
            <span id="userBadge" class="text-sm bg-indigo-800 px-3 py-1 rounded-full border border-indigo-500"></span>
            <button onclick="handleLogout()" class="bg-rose-600 hover:bg-rose-700 text-white text-sm px-3 py-1.5 rounded transition">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> Keluar
            </button>
        </div>
    </header>

    <!-- Main Container View Routing -->
    <main class="flex-1 justify-center items-center p-4 flex">

        <!-- VIEW 1: LOGIN -->
        <section id="viewLogin" class="w-full max-w-md bg-white p-8 rounded-xl shadow-lg border border-slate-200">
            <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center">Masuk Akun CBT</h2>
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Email</label>
                    <input type="email" id="loginEmail" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Kata Sandi</label>
                    <input type="password" id="loginPassword" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition">
                    Masuk
                </button>
            </form>
        </section>

        <!-- VIEW 2: DASHBOARD ADMIN / GURU -->
        <section id="viewDashboard" class="hidden w-full max-w-5xl bg-white p-6 rounded-xl shadow border border-slate-200">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <div>
                    <h2 class="text-2xl font-bold text-slate-800">Panel Pengelola Ujian</h2>
                    <p class="text-sm text-slate-500">Kelola soal, jadwal ujian, dan rekap nilai siswa.</p>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Daftar Ujian Aktif -->
                <div class="bg-slate-50 p-4 rounded-lg border">
                    <h3 class="font-bold text-lg mb-3 text-indigo-700"><i class="fa-solid fa-file-pen mr-2"></i>Daftar Ujian</h3>
                    <div id="examListAdmin" class="space-y-2">
                        <!-- Loaded dynamically -->
                    </div>
                </div>

                <!-- Rekap Nilai -->
                <div class="bg-slate-50 p-4 rounded-lg border">
                    <h3 class="font-bold text-lg mb-3 text-emerald-700"><i class="fa-solid fa-square-poll-vertical mr-2"></i>Hasil Ujian Siswa</h3>
                    <div id="resultListAdmin" class="space-y-2 max-h-80 overflow-y-auto">
                        <!-- Loaded dynamically -->
                    </div>
                </div>
            </div>
        </section>

        <!-- VIEW 3: INTRUKSI & DAFTAR UJIAN SISWA -->
        <section id="viewStudentHome" class="hidden w-full max-w-3xl bg-white p-6 rounded-xl shadow border border-slate-200">
            <h2 class="text-2xl font-bold mb-2">Selamat Datang di Portal Ujian</h2>
            <p class="text-slate-600 mb-6">Pilih ujian yang tersedia untuk memulai.</p>
            <div id="studentExamList" class="space-y-4">
                <!-- Loaded dynamically -->
            </div>
        </section>

        <!-- VIEW 4: RUANG UJIAN (CBT ENGINE) -->
        <section id="viewExamEngine" class="hidden w-full max-w-4xl bg-white rounded-xl shadow-xl border overflow-hidden">
            <!-- Top bar -->
            <div class="bg-slate-800 text-white px-6 py-3 flex justify-between items-center">
                <span id="examTitle" class="font-bold text-lg">Ujian CBT</span>
                <div class="bg-rose-600 px-4 py-1 rounded-full font-mono font-bold text-lg" id="timerDisplay">
                    00:00:00
                </div>
            </div>

            <div class="p-6 grid grid-cols-1 md:grid-cols-4 gap-6">
                <!-- Soal & Opsi -->
                <div class="md:col-span-3 space-y-6">
                    <div class="flex justify-between items-center border-b pb-2">
                        <span class="font-bold text-indigo-600">Soal No. <span id="currentQuestionNum">1</span></span>
                        <span class="text-xs bg-amber-100 text-amber-800 px-2 py-1 rounded">Peringatan Kecurangan: <b id="violationCount">0</b>/3</span>
                    </div>
                    <div id="questionText" class="text-lg font-medium leading-relaxed">
                        <!-- Tek Soal -->
                    </div>
                    <div id="optionsContainer" class="space-y-3">
                        <!-- Pilihan Jawaban -->
                    </div>
                    <div class="flex justify-between pt-4 border-t">
                        <button onclick="navigateQuestion(-1)" class="bg-slate-200 hover:bg-slate-300 px-4 py-2 rounded">Sebelumnya</button>
                        <button onclick="navigateQuestion(1)" class="bg-indigo-600 text-white hover:bg-indigo-700 px-4 py-2 rounded">Selanjutnya</button>
                    </div>
                </div>

                <!-- Navigasi Soal Grid -->
                <div class="border-l pl-4">
                    <h4 class="font-bold text-sm mb-3">Navigasi Soal</h4>
                    <div id="questionGrid" class="grid grid-cols-4 gap-2">
                        <!-- Grid Tombol Nomor -->
                    </div>
                    <button onclick="confirmSubmitExam()" class="mt-6 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded">
                        Selesaikan Ujian
                    </button>
                </div>
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
